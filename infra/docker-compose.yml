# ═══════════════════════════════════════════════════════════════
# EcoTrace — Production Compose
#
# Network model:
#   * Every service runs on the internal "ecotrace" bridge network.
#   * Only nginx publishes host ports (80, 443) — the single entry point.
#   * Postgres / NATS / backend services are reachable ONLY via nginx
#     from the host, and only via service-name DNS from other containers.
#
# Secrets (POSTGRES_PASSWORD, JWT_SECRET, BOOTSTRAP_TOKEN, ADMIN_TOKEN,
# TUNNEL_PUBLIC_URL, etc.) are loaded from the repo-root .env via
# docker-compose's automatic substitution.
# ═══════════════════════════════════════════════════════════════

services:
  # ─── PostgreSQL (internal only) ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB:       ecotrace
      POSTGRES_USER:     ecotrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    # No `ports:` — reachable only from `ecotrace` network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecotrace -d ecotrace"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - ecotrace

  # ─── NATS (internal only) ───────────────────────────────────────────────
  nats:
    image: nats:2.10-alpine
    restart: always
    command: ["-js", "-m", "8222"]
    # No `ports:` — NATS not reachable from host
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - ecotrace

  # ─── Auth Service (internal only) ────────────────────────────────────────
  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    restart: always
    environment:
      JWT_SECRET:          ${JWT_SECRET}
      JWT_EXPIRY_MINUTES:  ${JWT_EXPIRY_MINUTES:-60}
      PORT:                "3001"
    # No `ports:` — reachable only from nginx / frontend via service DNS
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - ecotrace

  # ─── Registration Service (internal only) ───────────────────────────────
  registration-service:
    build:
      context: ../services/registration-service
      dockerfile: Dockerfile
    restart: always
    environment:
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN}
      JWT_SECRET:      ${JWT_SECRET}
      DATABASE_URL:    postgres://ecotrace:${POSTGRES_PASSWORD}@postgres:5432/ecotrace
      PORT:            "3002"
    # No `ports:`
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - ecotrace

  # ─── OTLP HTTP Ingestion (internal only) ─────────────────────────────────
  ingestion-http:
    build:
      context: ../services/ingestion-http
      dockerfile: Dockerfile
    restart: always
    environment:
      NATS_URL: nats://nats:4222
      PORT:     "4318"
    # No `ports:`
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4318/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ecotrace

  # ─── Ingestion Worker (consumes NATS → Postgres) ────────────────────────
  ingestion-worker:
    build:
      context: ../services/ingestion-worker
      dockerfile: Dockerfile
    restart: always
    environment:
      NATS_URL:     nats://nats:4222
      DATABASE_URL: postgres://ecotrace:${POSTGRES_PASSWORD}@postgres:5432/ecotrace
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('pg').Pool && process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ecotrace

  # ─── Attribution Engine ──────────────────────────────────────────────────
  attribution-engine:
    build:
      context: ../services/attribution-engine
      dockerfile: Dockerfile
    container_name: ecotrace-attribution-engine
    restart: always
    environment:
      DATABASE_URL:            postgres://ecotrace:${POSTGRES_PASSWORD}@postgres:5432/ecotrace
      ATTRIBUTION_INTERVAL_MS: "30000"
      AGGREGATION_INTERVAL_MS: "300000"
      NODE_ENV:                production
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - --tries=1 http://127.0.0.1:3004/health | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - ecotrace

  # ─── REST API (JWT-protected; reachable from nginx & frontend) ───────────
  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: ecotrace-api
    restart: always
    # No `ports:` — nginx / frontend talk to it by service name
    environment:
      DATABASE_URL:      postgres://ecotrace:${POSTGRES_PASSWORD}@postgres:5432/ecotrace
      AUTH_SERVICE_URL:  http://auth-service:3001
      ADMIN_TOKEN:       ${ADMIN_TOKEN}
      JWT_SECRET:        ${JWT_SECRET}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,https://localhost,http://127.0.0.1,https://127.0.0.1}
      PORT:              "3003"
      NODE_ENV:          production
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - ecotrace

  # ─── WebSocket bridge (NATS → browser) ───────────────────────────────────
  websocket:
    build:
      context: ../services/websocket
      dockerfile: Dockerfile
    container_name: ecotrace-websocket
    restart: always
    environment:
      NATS_URL:      nats://nats:4222
      NATS_SUBJECTS: "telemetry.raw"
      PORT:          "3010"
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3010/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - ecotrace

  # ─── Frontend (Next.js) ──────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ecotrace-frontend
    restart: always
    environment:
      NODE_ENV:            production
      PORT:                "3000"
      HOSTNAME:            "0.0.0.0"
      BACKEND_API_URL:     http://api:3003
      AUTH_SERVICE_URL:    http://auth-service:3001
      NEXT_PUBLIC_API_BASE_URL: ""
      NEXT_PUBLIC_WS_URL:  ""
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 25s
    networks:
      - ecotrace

  # ─── nginx — single entry point, publishes host ports 80 + 443 ──────────
  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "${NGINX_PORT_HTTP:-80}:80"
      - "${NGINX_PORT_HTTPS:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      auth-service:
        condition: service_healthy
      registration-service:
        condition: service_healthy
      ingestion-http:
        condition: service_healthy
      api:
        condition: service_healthy
      websocket:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk https://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - ecotrace

volumes:
  pgdata:

networks:
  ecotrace:
    driver: bridge
    internal: false  # nginx needs bridge for the SSH-tunnelled ingress; services themselves don't publish ports
