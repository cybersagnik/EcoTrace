services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecotrace
      POSTGRES_USER: ecotrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"    # local only, never expose to internet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecotrace"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ecotrace

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - ecotrace

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "0.0.0.0:443:443"
      - "0.0.0.0:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      auth-service:
        condition: service_healthy
      registration-service:
        condition: service_healthy
      ingestion-http:
        condition: service_healthy
    networks:
      - ecotrace

  # ── Ingestion HTTP Service (replaces OTel Collector) ─────────────────────
  ingestion-http:
    build:
      context: ../services/ingestion-http
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NATS_URL: nats://nats:4222
      PORT: "4318"
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4318/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ecotrace
  ingestion-worker:
    build:
      context: ../services/ingestion-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NATS_URL:     nats://nats:4222
      DATABASE_URL: postgres://ecotrace:${POSTGRES_PASSWORD}@postgres:5432/ecotrace
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('pg').Pool && process.exit(0)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ecotrace
  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      JWT_SECRET:          ${JWT_SECRET}
      JWT_EXPIRY_MINUTES:  "60"
      PORT:                "3001"
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - ecotrace

  registration-service:
    build:
      context: ../services/registration-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN}
      JWT_SECRET:      ${JWT_SECRET}
      DATABASE_URL:    postgres://ecotrace:${POSTGRES_PASSWORD}@postgres:5432/ecotrace
      PORT:            "3002"
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - ecotrace

  # ═══════════════════════════════════════════════════════════════
  # PHASE 2: Attribution Engine
  # Polls emissions_raw, calculates carbon_g, aggregates daily
  # ═══════════════════════════════════════════════════════════════
  attribution-engine:
    build:
      context: ../services/attribution-engine
      dockerfile: Dockerfile
    container_name: ecotrace-attribution-engine
    environment:
      DATABASE_URL: postgresql://ecotrace:${POSTGRES_PASSWORD}@postgres:5432/ecotrace
      ATTRIBUTION_INTERVAL_MS: "30000"
      AGGREGATION_INTERVAL_MS: "300000"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - ecotrace

  # ═══════════════════════════════════════════════════════════════
  # PHASE 2: REST API
  # /api/* endpoints with JWT auth, device mgmt, recommendations
  # ═══════════════════════════════════════════════════════════════
  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: ecotrace-api
    ports:
      - "127.0.0.1:3003:3003"
    environment:
      DATABASE_URL: postgresql://ecotrace:${POSTGRES_PASSWORD}@postgres:5432/ecotrace
      AUTH_SERVICE_URL: http://auth-service:3001
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      PORT: "3003"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - ecotrace

volumes:
  pgdata:

networks:
  ecotrace:
    driver: bridge
