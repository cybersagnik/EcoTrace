events {
  worker_connections 1024;
}

http {
  limit_req_zone $binary_remote_addr zone=api:10m      rate=30r/m;
  limit_req_zone $binary_remote_addr zone=register:10m rate=5r/m;

  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  # Docker internal DNS — resolves upstreams at request time, not startup
  resolver 127.0.0.11 valid=10s;
  resolver_timeout 5s;

  server {
    listen 80;
    location /health { return 200 "ok\n"; add_header Content-Type text/plain; }
    location /       { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;

    location /v1/ {
      limit_req zone=api burst=20 nodelay;
      auth_request /internal/auth/verify;
      auth_request_set $device_id    $upstream_http_x_device_id;
      auth_request_set $device_class $upstream_http_x_device_class;
      proxy_set_header X-Device-ID    $device_id;
      proxy_set_header X-Device-Class $device_class;

      set $upstream_ingestion http://ingestion-http:4318;
      proxy_pass         $upstream_ingestion;
      proxy_set_header   Host $host;
      proxy_read_timeout 30s;
    }

    location /register {
      limit_req zone=register burst=3 nodelay;
      set $upstream_reg http://registration-service:3002;
      proxy_pass       $upstream_reg;
      proxy_set_header Host $host;
    }

    location /auth/token {
      limit_req zone=register burst=5 nodelay;
      set $upstream_auth http://auth-service:3001;
      proxy_pass       $upstream_auth/token;
      proxy_set_header Host $host;
    }

    location /internal/auth/verify {
      internal;
      set $upstream_verify http://auth-service:3001;
      proxy_pass              $upstream_verify/verify;
      proxy_pass_request_body off;
      proxy_set_header        Content-Length    "";
      proxy_set_header        Authorization     $http_authorization;
      proxy_set_header        X-Original-URI    $request_uri;
    }

    location /health {
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }
  }
}
