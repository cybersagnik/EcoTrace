events {
  worker_connections 1024;
}

http {
  # ─── Rate-limit zones (token bucket per client IP) ──────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m      rate=30r/m;
  limit_req_zone $binary_remote_addr zone=register:10m rate=5r/m;

  # ─── WebSocket upgrade map ──────────────────────────────────────────────
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ─── Logging ────────────────────────────────────────────────────────────
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  # ─── Docker DNS resolver (resolved at request time, not startup) ───────
  resolver 127.0.0.11 valid=10s;
  resolver_timeout 5s;

  # ─── Default proxy + buffer tuning ──────────────────────────────────────
  proxy_buffer_size          16k;
  proxy_buffers              8 16k;
  proxy_busy_buffers_size    32k;
  proxy_connect_timeout      10s;
  proxy_send_timeout         60s;
  proxy_read_timeout         60s;
  proxy_http_version         1.1;
  proxy_redirect             off;

  # ─── gzip ───────────────────────────────────────────────────────────────
  gzip               on;
  gzip_vary          on;
  gzip_proxied       any;
  gzip_comp_level    5;
  gzip_min_length    256;
  gzip_types         text/plain
                     text/css
                     text/xml
                     application/json
                     application/javascript
                     application/x-javascript
                     application/xml+rss
                     application/atom+xml
                     image/svg+xml;

  # ─── Upstream declarations (Docker DNS resolves at runtime) ──────────────
  upstream backend_api {
    server api:3003 max_fails=3 fail_timeout=10s;
    keepalive 8;
  }

  upstream auth_service {
    server auth-service:3001 max_fails=3 fail_timeout=10s;
    keepalive 8;
  }

  upstream websocket_svc {
    server websocket:3010 max_fails=3 fail_timeout=10s;
    keepalive 8;
  }

  upstream frontend_app {
    server frontend:3000 max_fails=3 fail_timeout=10s;
    keepalive 8;
  }

  # ─── Common security header set (re-applied at server level too) ────────
  add_header X-Frame-Options             "DENY"                     always;
  add_header X-Content-Type-Options      "nosniff"                  always;
  add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
  add_header X-XSS-Protection            "1; mode=block"            always;
  add_header Permissions-Policy          "camera=(), microphone=(), geolocation=()" always;

  # ─── HTTP → HTTPS (80) ──────────────────────────────────────────────────
  server {
    listen 80 default_server;
    server_name _;

    location /health { return 200 "ok\n"; add_header Content-Type text/plain; }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ─── HTTPS (443) ────────────────────────────────────────────────────────
  server {
    listen 443 ssl default_server;
    http2 on;

    ssl_certificate     /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (1 year, include subdomains) — safe to enable with self-signed
    # because browsers only honour HSTS over a successful TLS handshake.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content-Security-Policy for the dashboard — allow same-origin only,
    # plus inline theme script (set in app/layout.tsx).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ─── Device telemetry ingestion (OTLP) ────────────────────────────────
    location /v1/ {
      limit_req zone=api burst=20 nodelay;
      auth_request /internal/auth/verify;
      auth_request_set $device_id    $upstream_http_x_device_id;
      auth_request_set $device_class $upstream_http_x_device_class;
      proxy_set_header X-Device-ID    $device_id;
      proxy_set_header X-Device-Class $device_class;

      proxy_pass http://ingestion-http:4318;
      proxy_set_header Host $host;
      proxy_read_timeout 30s;
    }

    # ─── Device registration ──────────────────────────────────────────────
    location /register {
      limit_req zone=register burst=3 nodelay;
      proxy_pass http://registration-service:3002;
      proxy_set_header Host $host;
    }

    # ─── Token issuance (used by /api/auth/login proxy upstream) ──────────
    location /auth/token {
      limit_req zone=register burst=5 nodelay;
      proxy_pass http://auth-service:3001/token;
      proxy_set_header Host $host;
    }

    # ─── Internal JWT verify (called by auth_request) ──────────────────────
    location /internal/auth/verify {
      internal;
      proxy_pass http://auth-service:3001/verify;
      proxy_pass_request_body off;
      proxy_set_header        Content-Length    "";
      proxy_set_header        Authorization     $http_authorization;
      proxy_set_header        X-Original-URI    $request_uri;
    }

    # ─── /api/* — JWT-protected REST API (proxied by nginx) ───────────────
    # Public liveness probe — no auth, hits the same upstream's /health.
    location = /api/health {
      proxy_pass http://backend_api/health;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      access_log off;
    }

    # Public login endpoint — issues a JWT for the dashboard.
    location = /api/auth/login {
      proxy_pass http://backend_api/api/auth/login;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      auth_request /internal/auth/verify;
      auth_request_set $device_id $upstream_http_x_device_id;

      proxy_pass http://backend_api;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Device-ID       $device_id;
    }

    # ─── /admin/* — admin token only (no JWT) ─────────────────────────────
    location /admin/ {
      proxy_pass http://backend_api;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Plain nginx health ────────────────────────────────────────────────
    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # ─── WebSocket bridge (NATS → browser) ────────────────────────────────
    location /ws {
      proxy_pass http://websocket_svc;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host       $host;
      proxy_read_timeout  86400s;
      proxy_send_timeout  86400s;
    }

    # ─── Frontend (Next.js) ────────────────────────────────────────────────
    location / {
      proxy_pass http://frontend_app;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
    }
  }
}
